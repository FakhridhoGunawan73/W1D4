<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #B6CEB4;">
    <header style="background-color: #96A78D; text-align: center;">
        <h1>Student Registration Form</h1>
        <nav>
            <a href="#">Personal Infomation</a>
            <a href="#">Academic Information</a>
            <a href="#">Additional Details</a>
        </nav>
        <p>Please fill in the form below to register as a new student</p>
    </header>
    <main>
        <form>
            <section id="personal_information">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="nama">Full Name</label><br>
                    <input type="text" name="name" id="name" placeholder="Your Name" required><br><br>

                    <label for="email">Email</label><br>
                    <input type="text" email="nama" id="email" placeholder="you@example.com" required><br><br>

                    <label for="password">Password</label><br>
                    <input type="password" name="password" id="password" placeholder="Your Password" required><br><br>

                    <label for="dateofbirth">Day Of Birth</label><br>
                    <input type="date" name="date" id="date"><br><br>

                    <label for="gender">Gender</label><br>
                        <input type="radio" name="gender" id="male" value="male">
                        <label for="male">Male</label><br>
                        <input type="radio" name="gender" id="female" value="female">
                        <label for="female">Female</label><br>
                        <input type="radio" name="gender" id="other" value="other">
                        <label for="other">Other</label>
                </fieldset>
        
                <fieldset>
                    <legend>Academic Information</legend>
                    <label for="program_of_study">Program of Study</label><br>
                    <select name="profram_of_study" id="program_of_study">
                        <option value="teknik_informatika">Teknik Informatika</option>
                        <option value="teknik_sipil">Teknik Sipil</option>
                        <option value="teknik_mesin">Teknik Mesin</option>
                        <option value="administrasi_bisnin">Administrasi Bisnis</option>
                    </select><br><br>

                    <label for="leanguages">Leanguages Known</label><br>
                    <input type="checkbox" name="leanguages" id="english" value="english">
                    <label for="english">English</label><br>
                    <input type="checkbox" name="leanguages" id="Indonesia" value="indonesia">
                    <label for="indonesia">Indonesia</label><br>
                    <input type="checkbox" name="leanguages" id="Korea" value="korea">
                    <label for="korea">Korea</label><br><br>

                    <label for="avatar">Choose Photo Profile</label><br>
                    <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg, image/jpg">
                </fieldset>

                <fieldset>
                    <legend>Additional Details</legend>
                    <label for="addres">Adress</label><br>
                    <textarea rows="7" cols="40" name="adress" id="adress" placeholder="Your home adress..."></textarea><br><br>
                    <label for="want">Why do you want to join this program?</label><br>
                    <textarea rows="7" cols="40" name="want" id="want" placeholder="write a few sentences..."></textarea>
                </fieldset>
            </section>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </form>       
    </main>
</body>
</html>
